<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Path of Building</title>
    <!-- GitHub Pages는 교차 출처 격리 헤더를 못 붙이므로 서비스 워커가 대신 붙입니다 (PoB의 SharedArrayBuffer에 필요). -->
    <script src="coi-serviceworker.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
      #window {
        width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        color: #ddd; font: 16px/1.6 system-ui, sans-serif; text-align: center;
      }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"><div id="window"></div></div>
    <div id="status" hidden></div>
    <script type="module" src="/src/js/gacha-run.ts"></script>
  </body>
</html>
