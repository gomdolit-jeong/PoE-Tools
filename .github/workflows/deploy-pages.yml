name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 추천 스타터 빌드 목록을 새로 받아서 다시 배포합니다 (1시간마다)
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 실패해도 저장소에 있는 마지막 목록으로 배포는 계속합니다.
      - name: Crawl starter builds
        continue-on-error: true
        run: python3 tools/crawl_starter_builds.py

      # 크래프팅 계산기 시세 (poe.ninja): 매시간 배포마다 새로 받습니다. 실패하면 저장소 파일을 씁니다.
      - name: Crawl crafting prices
        continue-on-error: true
        run: python3 tools/crawl_prices.py

      # 한글 데이터: 군단 주얼 페이지·PoB 패시브 툴팁(poedb), PoB 아이템·젬 툴팁(RePoE 게임 번역),
      # 크래프팅 계산기 옵션·가중치(RePoE).
      # 받는 양이 커서 매시간 배포에서는 하루 한 번(UTC 0시)만 받고, push·직접 실행 때는 항상 받습니다.
      # 실패하거나 너무 적게 읽히면 저장소 파일을 씁니다.
      - name: Crawl Korean names and translations
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "00" ]; then
            python3 tools/crawl_timeless_korean.py || echo "poedb 한글 수집 실패: 저장소 파일을 씁니다"
            python3 tools/crawl_korean_stats.py || echo "RePoE 번역 수집 실패: 저장소 파일을 씁니다"
            python3 tools/crawl_crafting_data.py || echo "RePoE 크래프팅 데이터 수집 실패: 저장소 파일을 씁니다"
          else
            echo "매시간 배포: 한글 데이터는 저장소 파일을 씁니다"
          fi

      - name: Publish
        run: dotnet publish PoETools.Web/PoETools.Web.csproj -c Release -o publish

      - name: Prepare for the /<repo>/ sub-path
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          # 프로젝트 사이트는 하위 경로에서 서비스되므로 기준 경로를 바꾼다
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" publish/wwwroot/index.html
          grep -q "<base href=\"${BASE_PATH}\" />" publish/wwwroot/index.html
          # 브라우저가 예전 CSS를 캐시해 두고 쓰지 않게 배포마다 주소를 바꾼다
          sed -i "s|href=\"css/app.css\"|href=\"css/app.css?v=${GITHUB_SHA::8}\"|" publish/wwwroot/index.html
          grep -q "css/app.css?v=" publish/wwwroot/index.html
          # 주소를 직접 열거나 새로고침해도 Blazor 라우터가 처리하도록 한다
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Jekyll이 _framework 폴더를 빼지 않게 한다
          touch publish/wwwroot/.nojekyll

      # 브라우저용 Path of Building (tools/pob/build.sh). 빌드 결과는 캐시해서 매시간 배포 때 다시 쓰고,
      # tools/pob 파일이 바뀌면 처음부터 다시 빌드합니다.
      - uses: jdx/mise-action@v2
        with:
          install: false

      - uses: actions/cache@v4
        with:
          key: pob-${{ runner.os }}-${{ hashFiles('tools/pob/**') }}
          path: |
            .pob-work
            ~/.local/share/mise
            ~/.cache/deno

      # 실패해도 사이트 배포는 계속합니다 (그때는 PoB 페이지만 빠집니다).
      - name: Build Path of Building
        continue-on-error: true
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pob/
        run: bash tools/pob/build.sh publish/wwwroot/pob "$BASE_PATH"

      # 군단 주얼 페이지 데이터: 트리 지도(tools/build_timeless_tree.py)와 시드별 변환표(tools/build_timeless_luts.py, 약 33MB).
      # PoB 원본에서 만들고, PoB·트리 버전과 스크립트·한글 데이터가 같으면 캐시를 다시 씁니다.
      - name: Read PoB and tree versions
        id: pob
        run: |
          echo "tag=$(grep -oE 'POB_TAG:-[^}]+' tools/pob/build.sh | cut -d- -f2-)" >> "$GITHUB_OUTPUT"
          echo "tree=$(grep -oE 'TreeVersion = "[^"]+"' PoETools.Web/Core/PobCode.cs | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: timeless-cache
        with:
          key: timeless-${{ steps.pob.outputs.tag }}-${{ steps.pob.outputs.tree }}-${{ hashFiles('tools/build_timeless_luts.py', 'tools/build_timeless_tree.py', 'tools/timeless_korean.json') }}
          path: .timeless-data

      # 실패해도 사이트 배포는 계속합니다 (그때는 군단 주얼 페이지에서 변환 목록만 빠집니다).
      - name: Build timeless jewel data
        if: steps.timeless-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          POB_TAG: ${{ steps.pob.outputs.tag }}
          TREE_VERSION: ${{ steps.pob.outputs.tree }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch "$POB_TAG" https://github.com/PathOfBuildingCommunity/PathOfBuilding.git .pob-timeless
          git -C .pob-timeless sparse-checkout set --no-cone /src/Data/TimelessJewelData/ "/src/TreeData/$TREE_VERSION/tree.lua"
          # 중간에 실패한 결과가 캐시되지 않게 다 만든 뒤에 옮깁니다.
          mkdir -p .timeless-tmp
          python3 tools/build_timeless_tree.py ".pob-timeless/src/TreeData/$TREE_VERSION/tree.lua" .timeless-tmp/timeless-tree.json
          python3 tools/build_timeless_luts.py .pob-timeless/src .timeless-tmp/timeless .timeless-tmp/timeless-tree.json
          mv .timeless-tmp .timeless-data

      # 만들지 못했으면 저장소의 트리 지도만 그대로 쓰고 변환표는 빠집니다.
      - name: Copy timeless jewel data
        run: |
          if [ -d .timeless-data ]; then
            cp .timeless-data/timeless-tree.json publish/wwwroot/data/timeless-tree.json
            cp -r .timeless-data/timeless publish/wwwroot/data/timeless
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
